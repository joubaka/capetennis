name: CI — Full Test Suite

on:
  push:
    branches: [main, develop, "release/*"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.5"
  DB_CONNECTION: sqlite
  DB_DATABASE: ":memory:"

jobs:
  # ---------------------------------------------------------------
  # Code quality gate — runs fast, blocks all other jobs if it fails
  # ---------------------------------------------------------------
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_sqlite, mbstring, xml, json
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check for dd() / dump() / var_dump()
        run: |
          if grep -rn --include="*.php" \
            -e '\bdd(' -e '\bdump(' -e '\bvar_dump(' \
            app/ database/ routes/ 2>/dev/null | grep -v "/vendor/"; then
            echo "::error::Found dd()/dump()/var_dump() in committed code — remove before merging"
            exit 1
          fi
          echo "✅ No debug output calls found"

      - name: Check for direct financial mutations (raw DB on wallet tables)
        run: |
          if grep -rn --include="*.php" \
            -e "DB::table('wallets')" -e 'DB::table("wallets")' \
            -e "DB::table('wallet_transactions')" -e 'DB::table("wallet_transactions")' \
            app/Http app/Console 2>/dev/null; then
            echo "::warning::Direct DB mutations on financial tables detected — ensure these go through service layer"
          fi

  # ---------------------------------------------------------------
  # Migration safety
  # ---------------------------------------------------------------
  migrations:
    name: Migration Safety
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_sqlite, mbstring, xml, json
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check for unsafe migration patterns
        run: |
          UNSAFE=$(grep -rn --include="*.php" \
            -e "Schema::drop(" \
            -e "->dropColumn(" \
            -e "->drop(" \
            database/migrations/ 2>/dev/null || true)
          if [ -n "$UNSAFE" ]; then
            echo "::warning::Potentially unsafe migration patterns detected (Schema::drop / dropColumn):"
            echo "$UNSAFE"
          fi

      - name: Run migrations (SQLite)
        env:
          APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
        run: |
          cp .env.example .env 2>/dev/null || true
          php artisan key:generate --force 2>/dev/null || true
          php artisan migrate --force

      - name: Verify migrate:status shows no pending
        env:
          APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
        run: |
          PENDING=$(php artisan migrate:status --no-ansi 2>/dev/null | grep -c "| No " || true)
          if [ "$PENDING" -gt "0" ]; then
            echo "::error::$PENDING pending migration(s) after migrate --force — migration broken"
            exit 1
          fi
          echo "✅ All migrations applied"

  # ---------------------------------------------------------------
  # Draw suite — isolated
  # ---------------------------------------------------------------
  test-draw:
    name: Draw Suite
    runs-on: ubuntu-latest
    needs: migrations
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_sqlite, mbstring, xml, json
          coverage: none
          ini-values: memory_limit=512M

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run draw tests
        env:
          APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
        run: |
          php artisan test --testsuite=Feature \
            --filter="Draw|Bracket|Fixture|Progression|Standing|RoundRobin|Engine|Parity|Golden" \
            --memory-limit=512M \
            --stop-on-failure

  # ---------------------------------------------------------------
  # Cleanup suite — isolated
  # ---------------------------------------------------------------
  test-cleanup:
    name: Cleanup Suite
    runs-on: ubuntu-latest
    needs: migrations
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_sqlite, mbstring, xml, json
          coverage: none
          ini-values: memory_limit=256M

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run cleanup tests
        env:
          APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
        run: |
          php artisan test --testsuite=Feature \
            --filter="Cleanup|ProductionDataCleanup" \
            --memory-limit=256M \
            --stop-on-failure

  # ---------------------------------------------------------------
  # Platform / governance suite
  # ---------------------------------------------------------------
  test-platform:
    name: Platform Governance Suite
    runs-on: ubuntu-latest
    needs: migrations
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_sqlite, mbstring, xml, json
          coverage: none
          ini-values: memory_limit=256M

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run platform tests
        env:
          APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
        run: |
          php artisan test --testsuite=Feature \
            --filter="Platform|HealthCheck|FeatureFlag|Audit" \
            --memory-limit=256M \
            --stop-on-failure

  # ---------------------------------------------------------------
  # Full remaining feature tests
  # ---------------------------------------------------------------
  test-feature:
    name: Feature Tests (remaining)
    runs-on: ubuntu-latest
    needs: [test-draw, test-cleanup, test-platform]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_sqlite, mbstring, xml, json
          coverage: none
          ini-values: memory_limit=512M

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run all feature tests
        env:
          APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
        run: |
          php artisan test --testsuite=Feature \
            --memory-limit=512M
