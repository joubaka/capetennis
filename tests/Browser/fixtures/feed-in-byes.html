<script src="../../../public/js/tennis-bracket-layout.js"></script><script src="../../../public/js/tennis-bracket.js"></script><script>
const sparse = location.search.includes('sparse');
const size = sparse ? 8 : 16, depth = Math.log2(size), slots = {}, matches = {}, players = [];
const byes = sparse ? ['aaa','aab','aba','abb','baa'] : ['aaab','abab','baab','bbab'];
let id = 0, number = 0;
function visit(path) {
  if(path.length === depth) { if(byes.includes(path)) return slots[path] = {type:'bye'}; players.push({id:++id,name:'Fictional Player '+id}); return slots[path] = {type:'player',id}; }
  const sources = [visit(path+'a'),visit(path+'b')];
  if(sources[0].type === 'bye') return sources[1]; if(sources[1].type === 'bye') return sources[0];
  const key = 'main_'+(path || 'final');
  matches[key] = {section:'Main draw',path,round:depth-path.length,label:['Final','Semifinals','Quarterfinals'][path.length] || 'Round of '+2**(path.length+1),sources,number:++number,id:number,players:sources.map(source=>source.id || null),winner:null,sets:[]};
  return {type:'winner',match:key};
}
visit('');
const config = {workflow:'feed_in_monrad',readOnly:true,state:{draft:{size,slots},matches,players,positions:[],generated:true,published:true,locked:false}};
const node = document.createElement('script'); node.id='fm-config'; node.type='application/json'; node.textContent=JSON.stringify(config); document.body.append(node);
</script><script src="../../../public/js/flexible-monrad.js"></script></html>
